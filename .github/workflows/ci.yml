name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: make compile
      - name: CLI smoke test
        run: |
          python build_genres.py --help >/dev/null
          python build_russia_genres.py --help >/dev/null
          python verify_playlists.py --help >/dev/null
